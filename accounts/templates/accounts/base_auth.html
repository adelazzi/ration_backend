<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Ration{% endblock %}</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
      background: #0d0d0d;
      color: #f2f2f2;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    }
    .card {
      width: 100%;
      max-width: 380px;
      background: #171717;
      border: 1px solid #2a2a2a;
      border-radius: 12px;
      padding: 32px 28px;
    }
    .brand { font-size: 14px; letter-spacing: .12em; text-transform: uppercase; color: #8a8a8a; margin: 0 0 8px; }
    h1 { font-size: 24px; margin: 0 0 24px; }
    label { display: block; font-size: 13px; color: #b5b5b5; margin-bottom: 6px; }
    input {
      width: 100%;
      padding: 11px 12px;
      font-size: 15px;
      color: #f2f2f2;
      background: #0d0d0d;
      border: 1px solid #333;
      border-radius: 8px;
      outline: none;
    }
    input:focus { border-color: #f2f2f2; }
    .field { margin-bottom: 16px; }
    .error { color: #ff6b6b; font-size: 13px; margin-top: 6px; }
    .form-error {
      background: #2a1414; border: 1px solid #5c2323; color: #ff8a8a;
      padding: 10px 12px; border-radius: 8px; font-size: 14px; margin-bottom: 16px;
    }
    button {
      width: 100%;
      padding: 12px;
      margin-top: 8px;
      font-size: 15px;
      font-weight: 600;
      color: #0d0d0d;
      background: #f2f2f2;
      border: 0;
      border-radius: 8px;
      cursor: pointer;
    }
    button:hover { background: #ffffff; }
    .switch { text-align: center; font-size: 14px; color: #8a8a8a; margin: 20px 0 0; }
    .switch a { color: #f2f2f2; }
  </style>
</head>
<body>
  <main class="card">
    <p class="brand">Ration</p>
    {% block content %}{% endblock %}
  </main>
</body>
</html>

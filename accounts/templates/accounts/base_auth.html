<!doctype html>
<html lang="en">
<head>
  <title>{% block title %}Ration{% endblock %}</title>
  {% include "core/_head.html" %}
</head>
<body>
  <div class="auth">
    <aside class="auth-side">
      <span class="wordmark">
        <span class="wordmark-mark" aria-hidden="true"><span></span><span></span><span></span></span>
        Ration
      </span>
      <div>
        <p class="display">Price the batch before you mix it.</p>
        <p class="lede">Enter how many blocks a job needs and compare what every mix ratio will cost, using approved material prices.</p>
      </div>
      <div class="auth-recipe" aria-label="How materials are measured">
        <div class="recipe recipe-lg" aria-hidden="true">
          <span class="recipe-seg tone-sand" style="flex: 2"></span>
          <span class="recipe-seg tone-stone" style="flex: 2"></span>
          <span class="recipe-seg tone-cement" style="flex: 1"></span>
        </div>
        <div class="row">
          <span><span class="swatch tone-sand"></span>Sand by the wheelbarrow</span>
          <span><span class="swatch tone-stone"></span>Stone by the wheelbarrow</span>
          <span><span class="swatch tone-cement"></span>Cement by the pocket</span>
        </div>
      </div>
    </aside>
    <main class="auth-main">
      <div class="auth-form">
        {% block content %}{% endblock %}
      </div>
    </main>
  </div>
</body>
</html>
